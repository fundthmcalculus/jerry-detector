# Copy to config.yaml (gitignored) and edit.

cameras:
  # Perfect North feeds (HLS). Camera names become clip ids: letters, digits, - and _ only.
  - name: area-cam
    source: https://b15.hdrelay.com/camera/339bc87e-5059-4d09-9950-4f9f6f3e588e/relay/playlist.m3u8
    enabled: true
  - name: red-cam
    source: https://b15.hdrelay.com/camera/3c07ea8c-8050-4b02-bdd5-64b66ed7b82a/relay/playlist.m3u8
    enabled: true
  # RTSP and local video files also work (read with OpenCV):
  # - name: test
  #   source: rtsp://user:pass@192.168.1.50:554/stream1

stream:                       # http(s) sources are read through ffmpeg (must be on PATH)
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  frame_width: 960            # frames are downscaled to this width before detection
  timeout_seconds: 15.0       # drop and reconnect if the network stalls this long
  # user_agent: ...           # the relay returns 405 to ffmpeg/curl default agents

schedule:                     # no clips are ever saved outside these hours
  timezone: America/New_York  # follows EST/EDT
  open: "09:30"
  close: "21:30"              # set equal to open for 24h; close < open wraps past midnight
  spot_check_min_minutes: 20  # while closed, a random check every 20-60 min
  spot_check_max_minutes: 60
  spot_check_seconds: 15

detector:
  backend: yolo_pose          # yolo_pose | none
  model: yolo11n-pose.pt      # or a TensorRT .engine exported on the Jetson
  device: cpu                 # cpu | cuda | 0 (Jetson GPU)
  confidence: 0.4

rule:                         # crash heuristic; tune on real footage
  horizontal_ratio: 1.3       # box width/height at or above this counts as "down"
  hold_seconds: 1.0           # must stay down this long
  cooldown_seconds: 60.0      # minimum gap between clips per camera

clip:
  fps: 5                      # frames sampled per second; also GIF playback rate
  pre_seconds: 3.0
  post_seconds: 3.0
  gif_width: 480
  output_dir: clips
