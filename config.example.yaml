# Copy to config.yaml (gitignored) and edit.

cameras:
  # HLS playlists work directly (.m3u8). Replace the placeholder IDs.
  - name: area-cam
    source: https://b15.hdrelay.com/camera/<AREA_CAM_ID>/relay/playlist.m3u8
    enabled: true
  - name: red-cam
    source: https://b15.hdrelay.com/camera/<RED_CAM_ID>/relay/playlist.m3u8
    enabled: true
  # Also supported: rtsp://user:pass@host:554/stream, MJPEG URLs, or a video file path.

detector:
  backend: yolo_pose          # yolo_pose | none
  model: yolo11n-pose.pt      # or a TensorRT .engine exported on the Jetson
  device: cpu                 # cpu | cuda | 0 (Jetson GPU)
  confidence: 0.4

rule:                         # crash heuristic; tune on real footage
  horizontal_ratio: 1.3       # box width/height at or above this counts as "down"
  hold_seconds: 1.0           # must stay down this long
  cooldown_seconds: 60.0      # minimum gap between clips per camera

clip:
  fps: 5                      # frames sampled per second; also GIF playback rate
  pre_seconds: 3.0
  post_seconds: 3.0
  gif_width: 480
  output_dir: clips
